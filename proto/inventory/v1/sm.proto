// PART II, STEP 1 — The state machine of the inventory: its state, its
// commands and their results (compile with `make gen-proto`).
//
//   * the state machine has its OWN messages; the gRPC service converts its
//     requests into commands by hand (internal/grpcsvc/convert.go)
//   * ONE message, Command, describes every kind of command: one kind per RPC
//   * a batch of the API (an order, a batch delete) is ONE command, so it
//     stays all or nothing
//   * results are data (a code), not Go errors: every replica computes the same
//   * Snapshot = the whole state, to save it and to load it again
syntax = "proto3";
package inventory.v1;
import "inventory/v1/inventory.proto"; // reused: Product, SkuIdList, SortOrder
option go_package = "github.com/your-team/inventory/gen/inventory/v1;inventoryv1";

// ---- State ----------------------------------------------------------------
message State {
  map<string, Product> products = 1;  // sku_id -> product
  int64 revision = 2;                 // the store's version counter: the last
                                      // version handed out (0 = none yet)
  map<string, Session> sessions = 3;  // client_id -> its last applied write
}
// Safe retries: the last write a client got applied, and its answer.
message Session {
  int64 last_seq = 1;
  Result result = 2;
}
message Snapshot {
  State state = 1;
  int64 applied = 2;                  // commands applied to reach this state
}

// ---- Commands -------------------------------------------------------------
message Command {
  oneof kind {
    Read read = 1;                    // a query: changes nothing
    Create create = 2;
    Update update = 3;
    Delete delete = 4;                // 1..n products, all or nothing
    AddStock add_stock = 5;           // read-modify-write
    PlaceOrder place_order = 6;       // read-modify-write, 1..n items, all or nothing
  }
  // Safe retries (writes only): both set, or neither. A write whose seq is
  // the client's last one is not applied again; its saved result is returned.
  string client_id = 10;
  int64 seq = 11;
}
message Read {
  oneof select {                      // none = every product
    string single_sku_id = 1;         // exactly one (NOT_FOUND if missing)
    SkuIdList sku_id_list = 2;        // several (missing ones are skipped)
    string prefix = 3;
  }
  bool in_stock = 4;                  // only products with stock > 0
  SortOrder sort = 5;
  int32 limit = 6;                    // 0 = no limit
}
message Create {
  string sku_id = 1;
  string name = 2;
  int64 price_cents = 3;
  int64 stock = 4;
}
message Update {
  string sku_id = 1;
  optional string name = 2;           // unset = unchanged
  optional int64 price_cents = 3;
  optional int64 expected_version = 4;
}
message Delete {
  repeated Target targets = 1;
}
message Target {
  string sku_id = 1;
  optional int64 expected_version = 2;
}
message AddStock {
  string sku_id = 1;
  int64 add = 2;                      // >= 1
}
message PlaceOrder {
  repeated OrderLine lines = 1;
}
message OrderLine {
  string sku_id = 1;
  int64 quantity = 2;                 // >= 1
}

// ---- What a command returns -----------------------------------------------
enum Code {
  CODE_OK = 0;
  CODE_NOT_FOUND = 1;                 // -> gRPC NOT_FOUND           -> HTTP 404
  CODE_INVALID_ARGUMENT = 2;          // -> gRPC INVALID_ARGUMENT    -> HTTP 400
  CODE_ALREADY_EXISTS = 3;            // -> gRPC ALREADY_EXISTS      -> HTTP 409
  CODE_OUT_OF_STOCK = 4;              // -> gRPC FAILED_PRECONDITION -> HTTP 409
  CODE_STALE_REQUEST = 5;             // -> gRPC FAILED_PRECONDITION -> HTTP 409
  CODE_VERSION_MISMATCH = 6;          // -> gRPC ABORTED             -> HTTP 412
}
message Result {
  Code code = 1;
  string message = 2;                 // why it failed (for people)
  repeated Product products = 3;      // read: the matches, sorted; write: the
                                      // products after it, in request order
  int64 total_cents = 4;              // place_order: sum of quantity x price
}
